id: BF-002
technique_id: T1110.001
technique_name: "Brute Force: Network Protocol Password Guessing"
stage: Credential Access
severity: high
params: {}
phrase: "Network service brute force ({extra}) detected targeting {dest_ip} from {src_ip}"
sql: |
  SELECT 
    min(timestamp) as ts_start,
    max(timestamp) as ts_end,
    min(usr) as usr,
    min(src_host) as src_host,
    min(dest_host) as dest_host,
    src_ip,
    dest_ip,
    count(*) as event_count,
    process_name as extra
  FROM events
  WHERE event_type = 'ips_alert' 
    AND (
      process_name LIKE '%Brute.Force%' 
      OR process_name LIKE '%Brute%'
    )
  GROUP BY src_ip, dest_ip, process_name
