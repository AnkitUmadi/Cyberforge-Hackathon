id: PRV-001
technique_id: T1068
technique_name: "Exploitation for Privilege Escalation"
stage: Privilege Escalation
severity: critical
params: {}
phrase: "Privilege escalation exploit ({extra}) targeted {dest_ip} from {src_ip}"
sql: |
  SELECT 
    min(timestamp) as ts_start,
    max(timestamp) as ts_end,
    min(usr) as usr,
    min(src_host) as src_host,
    min(dest_host) as dest_host,
    src_ip,
    dest_ip,
    count(*) as event_count,
    process_name as extra
  FROM events
  WHERE event_type = 'ips_alert' 
    AND (
      -- Root stem matching for any privilege escalation attack
      process_name LIKE '%ZeroLogon%' 
      OR process_name LIKE '%.Escalat%'
      OR process_name LIKE '%Privilege%'
      OR process_name LIKE '%Elevat%'
    )
  GROUP BY src_ip, dest_ip, process_name
