id: EXP-001
technique_id: T1190
technique_name: "Exploit Public-Facing Application"
stage: Initial Access
severity: critical
params: {}
phrase: "Remote exploit signature ({extra}) targeted {dest_ip} from {src_ip}"
sql: |
  SELECT 
    min(timestamp) as ts_start,
    max(timestamp) as ts_end,
    min(usr) as usr,
    min(src_host) as src_host,
    min(dest_host) as dest_host,
    src_ip,
    dest_ip,
    count(*) as event_count,
    process_name as extra
  FROM events
  WHERE event_type = 'ips_alert' 
    AND NOT (
      process_name LIKE '%Mirai%' 
      OR process_name LIKE '%Cobalt%' 
      OR process_name LIKE '%Beacon%' 
      OR process_name LIKE '%Botnet%' 
      OR process_name LIKE '%Backdoor%' 
      OR process_name LIKE '%C2%'
      OR process_name LIKE '%ZeroLogon%' 
      OR process_name LIKE '%.Escalat%' 
      OR process_name LIKE '%Privilege%' 
      OR process_name LIKE '%Elevat%'
      OR process_name LIKE '%Password%' 
      OR process_name LIKE '%dump%' 
      OR process_name LIKE '%mimikatz%' 
      OR process_name LIKE '%Credential%'
      OR process_name LIKE '%Zone.Transfer%' 
      OR process_name LIKE '%Information.Disclosure%' 
      OR process_name LIKE '%Scan%' 
      OR process_name LIKE '%Discovery%' 
      OR process_name LIKE '%Enumerat%'
      OR process_name LIKE '%Brute.Force%' 
      OR process_name LIKE '%Brute%'
    )
  GROUP BY src_ip, dest_ip, process_name
