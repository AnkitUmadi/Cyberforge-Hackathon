id: EXP-001
technique_id: T1190
technique_name: "Exploit Public-Facing Application"
stage: Initial Access
severity: critical
params: {}
phrase: "Remote exploit signature ({extra}) targeted {dest_ip} from {src_ip}"
sql: |
  SELECT 
    min(timestamp) as ts_start,
    max(timestamp) as ts_end,
    min(usr) as usr,
    min(src_host) as src_host,
    min(dest_host) as dest_host,
    src_ip,
    dest_ip,
    count(*) as event_count,
    process_name as extra
  FROM events
  WHERE event_type = 'ips_alert' 
    AND (
      process_name LIKE '%Log4j%' 
      OR process_name LIKE '%SSLVPN%' 
      OR process_name LIKE '%Buffer.Overflow%' 
      OR process_name LIKE '%Directory.Traversal%'
      OR process_name LIKE '%Injection%'
      OR process_name LIKE '%WebLogic%'
      OR process_name LIKE '%vCenter%'
      OR process_name LIKE '%HTTP.sys%'
      OR process_name LIKE '%PHP.CGI%'
    )
  GROUP BY src_ip, dest_ip, process_name
